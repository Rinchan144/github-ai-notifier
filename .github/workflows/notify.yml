name: GitHub AI Notifier Enterprise V3

on:
  schedule:
    # Chạy tự động mỗi ngày vào lúc 00:00 sáng UTC (có thể điều chỉnh theo giờ bạn muốn)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ tab Actions trên GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # QUAN TRỌNG: Cấp quyền ghi (write) để workflow có thể commit và push file history ngược lại repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Telegram Notifier Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Nếu bạn có GITHUB_TOKEN riêng, GitHub Actions tự cung cấp, nhưng truyền vào đây giúp tăng rate limit API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/index.ts

      - name: Commit and push updated state and archives
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add file state, toàn bộ thư mục archives (bao gồm cả các file .md và file INDEX.md)
          git add data/sent-history.json archives/
          
          # Kiểm tra xem có thay đổi thực sự nào không
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update sent history, markdown archives, and index [skip ci]"
            git push
          fi